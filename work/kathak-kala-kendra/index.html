  <script defer src="/script.js"></script>
  <script>
    (() => {

      // ─── Easter egg ─────────────────────────────
      const styleId = 'project-page-easter-egg-styles';
      const poemLines = {
        privacy: [
          "privacy is not",
          "the absence of data.",
          "it's the presence",
          "of control."
        ],
        website: [
          "how you do one thing",
          "is how you do everything"
        ],
        random: [
          "ah, you found me",
          "hidden in the quiet hours",
          "where the shadows stretch and fold,",
          "among the limitless, pressed-in pixels,",
          "and the stories left untold."
        ]
      };
      const secretPalette = ['var(--pastel-1)', 'var(--pastel-2)', 'var(--pastel-3)', 'var(--pastel-4)', 'var(--pastel-5)', 'var(--pastel-6)'];
      let typedBuffer = '';
      let cursorX = window.innerWidth / 2;
      let cursorY = window.innerHeight / 2;
      let activePoemOverlay = null;
      let poemEscapeHandler = null;

      if (!document.getElementById(styleId)) {
        const style = document.createElement('style');
        style.id = styleId;
        style.textContent = `
          @keyframes ripple-out {
            0% { transform: scale(0); opacity: 0.7; }
            100% { transform: scale(4); opacity: 0; }
          }
          @keyframes fadeInLine {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
          }
          .easter-poem-overlay {
            position: fixed; inset: 0; z-index: 10000;
            background: color-mix(in srgb, var(--shade) 92%, transparent);
            display: flex; align-items: center; justify-content: center; padding: 2rem;
          }
          .easter-poem-content {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 0.2rem; text-align: center;
          }
          .easter-poem-line {
            opacity: 0; color: var(--on-shade); font-size: 1.4rem;
            line-height: 2.2; font-style: italic;
            animation: fadeInLine 0.8s ease forwards;
          }
          .easter-poem-close {
            position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            font-size: 0.75rem; opacity: 0.4; color: var(--on-shade);
          }
          .secret-ripple {
            width: 120px; height: 120px; border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999;
            animation: ripple-out 2s ease-out forwards; transform-origin: center center;
          }
          .secret-found-note {
            position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%);
            font-size: 0.85rem; font-style: italic; color: var(--text-secondary);
            opacity: 0; transition: opacity 0.4s ease; z-index: 9999; pointer-events: none;
          }
        `;
        document.head.appendChild(style);
      }

      const closePoemOverlay = () => {
        if (!activePoemOverlay) return;
        activePoemOverlay.remove();
        activePoemOverlay = null;
        if (poemEscapeHandler) {
          document.removeEventListener('keydown', poemEscapeHandler);
          poemEscapeHandler = null;
        }
      };

      const openPoemOverlay = (poemKey) => {
        const lines = poemLines[poemKey];
        if (!lines) return;
        closePoemOverlay();
        const overlay = document.createElement('div');
        overlay.className = 'easter-poem-overlay';
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');
        const content = document.createElement('div');
        content.className = 'easter-poem-content';
        lines.forEach((line, i) => {
          const el = document.createElement('p');
          el.className = 'easter-poem-line';
          el.style.animationDelay = `${i * 0.6}s`;
          el.textContent = line;
          content.appendChild(el);
        });
        const hint = document.createElement('p');
        hint.className = 'easter-poem-close';
        hint.textContent = 'click anywhere to close';
        overlay.appendChild(content);
        overlay.appendChild(hint);
        overlay.addEventListener('click', closePoemOverlay);
        poemEscapeHandler = (e) => { if (e.key === 'Escape') closePoemOverlay(); };
        document.addEventListener('keydown', poemEscapeHandler);
        document.body.appendChild(overlay);
        activePoemOverlay = overlay;
      };

      const attachPoemTrigger = (el, key) => {
        if (!el) return;
        el.style.cursor = 'pointer';
        el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); openPoemOverlay(key); });
      };

      document.querySelectorAll('[data-poem-trigger]').forEach(el => attachPoemTrigger(el, el.getAttribute('data-poem-trigger')));
      document.querySelectorAll('.poem-trigger[data-poem]').forEach(el => attachPoemTrigger(el, el.getAttribute('data-poem')));

      document.addEventListener('mousemove', (e) => { cursorX = e.clientX; cursorY = e.clientY; }, { passive: true });

      const playSecretChime = async () => {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        try {
          const ctx = playSecretChime.ctx || new Ctx();
          playSecretChime.ctx = ctx;
          if (ctx.state === 'suspended') await ctx.resume();
          const notes = [
            { frequency: 523, duration: 0.15, offset: 0 },
            { frequency: 659, duration: 0.15, offset: 0.15 },
            { frequency: 784, duration: 0.2,  offset: 0.3 }
          ];
          const now = ctx.currentTime;
          notes.forEach(({ frequency, duration, offset }) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = frequency;
            osc.connect(gain);
            gain.connect(ctx.destination);
            const t = now + offset;
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.linearRampToValueAtTime(0.08, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
            osc.start(t);
            osc.stop(t + duration);
          });
        } catch (_) {}
      };

      const showSecretFoundNote = () => {
        const note = document.createElement('p');
        note.className = 'secret-found-note';
        note.textContent = 'you found it';
        document.body.appendChild(note);
        requestAnimationFrame(() => { note.style.opacity = '1'; });
        setTimeout(() => { note.style.opacity = '0'; }, 2000);
        setTimeout(() => { note.remove(); }, 2400);
      };

      const triggerSecretExplosion = () => {
        for (let i = 0; i < 12; i++) {
          setTimeout(() => {
            const ripple = document.createElement('span');
            ripple.className = 'secret-ripple';
            ripple.style.left = `${cursorX - 60}px`;
            ripple.style.top  = `${cursorY - 60}px`;
            ripple.style.background = secretPalette[Math.floor(Math.random() * secretPalette.length)];
            document.body.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
          }, i * 80);
        }
        playSecretChime();
        setTimeout(showSecretFoundNote, 2200);
      };

      document.addEventListener('keydown', (e) => {
        if (!e.key || e.key.length !== 1) return;
        typedBuffer = `${typedBuffer}${e.key.toLowerCase()}`.slice(-6);
        if (typedBuffer === 'secret') { triggerSecretExplosion(); typedBuffer = ''; }
      });
    })();
  </script>
